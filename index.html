<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeJournal | Pro Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.4);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: 0 0 20px rgba(168, 85, 247, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #0f0c29;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* --- Glassmorphism Utilities --- */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .action-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        /* --- Dashboard Stats --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* --- Main Layout --- */
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* --- Entry Form --- */
        .form-section h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(0, 0, 0, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--accent-glow);
            transition: filter 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        /* --- Table Section --- */
        .table-section {
            display: flex;
            flex-direction: column;
            overflow: hidden; /* For border radius */
            padding: 0;
        }

        .table-controls {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-glass);
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* --- Badges & Colors --- */
        .text-green { color: var(--success); }
        .text-red { color: var(--danger); }
        .text-gradient { 
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-long { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-short { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .btn-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 5px;
            transition: color 0.2s;
        }
        .btn-icon:hover { color: white; }
        .btn-icon.delete:hover { color: var(--danger); }

        /* --- Chart Section --- */
        .chart-container {
            margin-bottom: 30px;
            padding: 20px;
            height: 300px;
            position: relative;
        }

        /* --- Empty State --- */
        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TradeJournal<span style="font-size: 0.5em; vertical-align: super; opacity: 0.7;">PRO</span></h1>
            <div>
                <button onclick="exportCSV()" class="action-btn">Export CSV</button>
                <button onclick="resetData()" class="action-btn" style="border-color: rgba(239,68,68,0.3); color: #fca5a5; margin-left: 10px;">Clear All</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="glass stat-card">
                <span class="stat-label">Total Trades</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="glass stat-card">
                <span class="stat-label">Win Rate</span>
                <span class="stat-value" id="stat-winrate">0%</span>
            </div>
            <div class="glass stat-card">
                <span class="stat-label">Net P&L</span>
                <span class="stat-value" id="stat-pnl">$0.00</span>
            </div>
            <div class="glass stat-card">
                <span class="stat-label">Avg Profit</span>
                <span class="stat-value" id="stat-avg">$0.00</span>
            </div>
            <div class="glass stat-card">
                <span class="stat-label">Best Trade</span>
                <span class="stat-value text-green" id="stat-best">$0.00</span>
            </div>
            <div class="glass stat-card">
                <span class="stat-label">Worst Trade</span>
                <span class="stat-value text-red" id="stat-worst">$0.00</span>
            </div>
        </div>

        <div class="glass chart-container">
            <canvas id="performanceChart"></canvas>
        </div>

        <div class="main-content">
            <div class="glass form-section" style="padding: 25px;">
                <h2>
                    <span id="form-title">New Trade</span>
                    <button id="cancel-edit" onclick="cancelEdit()" class="action-btn" style="display: none; font-size: 0.8rem; padding: 4px 8px;">Cancel</button>
                </h2>
                <form id="trade-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label>Date & Time</label>
                        <input type="datetime-local" id="date" required>
                    </div>

                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>Symbol</label>
                            <input type="text" id="symbol" placeholder="AAPL" style="text-transform: uppercase;" required>
                        </div>
                        <div>
                            <label>Type</label>
                            <select id="type">
                                <option value="Long">Long</option>
                                <option value="Short">Short</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>Entry Price ($)</label>
                            <input type="number" step="0.01" id="entry" placeholder="0.00" required>
                        </div>
                        <div>
                            <label>Exit Price ($)</label>
                            <input type="number" step="0.01" id="exit" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" step="any" id="qty" placeholder="Shares/Contracts" required>
                    </div>

                    <div class="form-group">
                        <label>Strategy</label>
                        <input type="text" id="strategy" placeholder="e.g. Breakout, Reversal">
                    </div>

                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="notes" rows="3" placeholder="Trade rationale..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">Add Trade</button>
                </form>
            </div>

            <div class="glass table-section">
                <div class="table-controls">
                    <span style="font-size: 0.9rem; font-weight: 600; margin-right: auto;">Trade History</span>
                    <button class="filter-btn active" onclick="filterTrades('all', this)">All</button>
                    <button class="filter-btn" onclick="filterTrades('win', this)">Wins</button>
                    <button class="filter-btn" onclick="filterTrades('loss', this)">Losses</button>
                    <button class="filter-btn" onclick="filterTrades('long', this)">Longs</button>
                    <button class="filter-btn" onclick="filterTrades('short', this)">Shorts</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Symbol</th>
                                <th>Type</th>
                                <th>Net P&L</th>
                                <th>Entry</th>
                                <th>Exit</th>
                                <th>Qty</th>
                                <th>Strategy</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="trade-list">
                            </tbody>
                    </table>
                    <div id="empty-msg" class="empty-state" style="display: none;">
                        No trades found. Start by adding your first trade!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let trades = JSON.parse(localStorage.getItem('trades')) || [];
        let currentFilter = 'all';
        let chartInstance = null;

        // --- DOM Elements ---
        const form = document.getElementById('trade-form');
        const tableBody = document.getElementById('trade-list');
        const emptyMsg = document.getElementById('empty-msg');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Set default datetime to now
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
            
            renderTable();
            updateStats();
            initChart();
        });

        // --- Form Handling ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const entryPrice = parseFloat(document.getElementById('entry').value);
            const exitPrice = parseFloat(document.getElementById('exit').value);
            const qty = parseFloat(document.getElementById('qty').value);
            const type = document.getElementById('type').value;

            // Calculate P&L
            let pnl = 0;
            if (type === 'Long') {
                pnl = (exitPrice - entryPrice) * qty;
            } else {
                pnl = (entryPrice - exitPrice) * qty;
            }

            const tradeData = {
                id: editId ? parseInt(editId) : Date.now(),
                date: document.getElementById('date').value,
                symbol: document.getElementById('symbol').value.toUpperCase(),
                type: type,
                entry: entryPrice,
                exit: exitPrice,
                qty: qty,
                strategy: document.getElementById('strategy').value,
                notes: document.getElementById('notes').value,
                pnl: pnl
            };

            if (editId) {
                // Update existing
                const index = trades.findIndex(t => t.id === parseInt(editId));
                trades[index] = tradeData;
                cancelEdit(); // Reset form mode
            } else {
                // Add new
                trades.push(tradeData);
            }

            saveData();
            renderTable();
            updateStats();
            updateChart();
            
            if (!editId) form.reset(); // Only reset if adding new
            
            // Reset date to current after submit
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
        });

        // --- Core Functions ---

        function saveData() {
            localStorage.setItem('trades', JSON.stringify(trades));
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(num);
        }

        function formatDate(dateString) {
            const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        function renderTable() {
            tableBody.innerHTML = '';
            
            // Apply filtering
            let filteredTrades = trades.sort((a, b) => new Date(b.date) - new Date(a.date)); // Newest first

            if (currentFilter === 'win') filteredTrades = filteredTrades.filter(t => t.pnl > 0);
            if (currentFilter === 'loss') filteredTrades = filteredTrades.filter(t => t.pnl <= 0);
            if (currentFilter === 'long') filteredTrades = filteredTrades.filter(t => t.type === 'Long');
            if (currentFilter === 'short') filteredTrades = filteredTrades.filter(t => t.type === 'Short');

            if (filteredTrades.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            } else {
                emptyMsg.style.display = 'none';
            }

            filteredTrades.forEach(trade => {
                const tr = document.createElement('tr');
                tr.className = 'animate-in';
                const pnlClass = trade.pnl >= 0 ? 'text-green' : 'text-red';
                const typeClass = trade.type === 'Long' ? 'badge-long' : 'badge-short';
                
                tr.innerHTML = `
                    <td style="color:var(--text-secondary); font-size:0.9rem;">${formatDate(trade.date)}</td>
                    <td style="font-weight:bold;">${trade.symbol}</td>
                    <td><span class="badge ${typeClass}">${trade.type}</span></td>
                    <td class="${pnlClass}" style="font-weight:bold;">${formatCurrency(trade.pnl)}</td>
                    <td>${trade.entry.toFixed(2)}</td>
                    <td>${trade.exit.toFixed(2)}</td>
                    <td>${trade.qty}</td>
                    <td style="font-size:0.9rem;">${trade.strategy || '-'}</td>
                    <td style="text-align: right;">
                        <button onclick="editTrade(${trade.id})" class="btn-icon" title="Edit">✎</button>
                        <button onclick="deleteTrade(${trade.id})" class="btn-icon delete" title="Delete">✕</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function updateStats() {
            const totalTrades = trades.length;
            const winningTrades = trades.filter(t => t.pnl > 0).length;
            const totalPnL = trades.reduce((sum, t) => sum + t.pnl, 0);
            
            // Win Rate
            const winRate = totalTrades > 0 ? ((winningTrades / totalTrades) * 100).toFixed(1) : 0;
            
            // Average Profit (only considering winning trades for pure avg win, or global average?)
            // Requirement says "Average Profit", usually means Net P&L / Total Trades or Avg Win. 
            // Let's do Net P&L / Total Trades (Expectancy)
            const avgProfit = totalTrades > 0 ? (totalPnL / totalTrades) : 0;

            // Best & Worst
            const bestTrade = trades.length > 0 ? Math.max(...trades.map(t => t.pnl)) : 0;
            const worstTrade = trades.length > 0 ? Math.min(...trades.map(t => t.pnl)) : 0;

            // DOM Updates
            document.getElementById('stat-total').innerText = totalTrades;
            document.getElementById('stat-winrate').innerText = `${winRate}%`;
            
            const pnlEl = document.getElementById('stat-pnl');
            pnlEl.innerText = formatCurrency(totalPnL);
            pnlEl.className = `stat-value ${totalPnL >= 0 ? 'text-green' : 'text-red'}`;

            document.getElementById('stat-avg').innerText = formatCurrency(avgProfit);
            document.getElementById('stat-best').innerText = formatCurrency(bestTrade);
            document.getElementById('stat-worst').innerText = formatCurrency(worstTrade);
        }

        // --- Actions ---

        function deleteTrade(id) {
            if(confirm('Are you sure you want to delete this trade?')) {
                trades = trades.filter(t => t.id !== id);
                saveData();
                renderTable();
                updateStats();
                updateChart();
            }
        }

        function editTrade(id) {
            const trade = trades.find(t => t.id === id);
            if (!trade) return;

            // Populate form
            document.getElementById('edit-id').value = trade.id;
            document.getElementById('date').value = trade.date;
            document.getElementById('symbol').value = trade.symbol;
            document.getElementById('type').value = trade.type;
            document.getElementById('entry').value = trade.entry;
            document.getElementById('exit').value = trade.exit;
            document.getElementById('qty').value = trade.qty;
            document.getElementById('strategy').value = trade.strategy;
            document.getElementById('notes').value = trade.notes;

            // Change UI state
            formTitle.innerText = "Edit Trade";
            submitBtn.innerText = "Update Trade";
            submitBtn.style.background = "linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%)";
            cancelEditBtn.style.display = 'inline-block';
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('edit-id').value = '';
            form.reset();
            
            // Reset date
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);

            formTitle.innerText = "New Trade";
            submitBtn.innerText = "Add Trade";
            submitBtn.style.background = ""; // Reset to CSS default
            cancelEditBtn.style.display = 'none';
        }

        function filterTrades(filterType, btnElement) {
            currentFilter = filterType;
            
            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            renderTable();
        }

        function resetData() {
            if(confirm('This will wipe all trade data. Are you sure?')) {
                localStorage.removeItem('trades');
                trades = [];
                renderTable();
                updateStats();
                updateChart();
            }
        }

        function exportCSV() {
            if (trades.length === 0) return alert("No trades to export!");

            const headers = ["Date", "Symbol", "Type", "Entry", "Exit", "Qty", "P&L", "Strategy", "Notes"];
            const rows = trades.map(t => [
                t.date, t.symbol, t.type, t.entry, t.exit, t.qty, t.pnl.toFixed(2), t.strategy, `"${t.notes}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8," 
                + headers.join(",") + "\n" 
                + rows.map(e => e.join(",")).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "trade_journal_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Chart.js Integration ---
        function initChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            // Gradient fill
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.5)'); // Purple
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Cumulative P&L',
                        data: [],
                        borderColor: '#a855f7',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#a855f7',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#94a3b8',
                            bodyFont: { size: 14, weight: 'bold' },
                            callbacks: {
                                label: function(context) {
                                    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(context.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
            updateChart();
        }

        function updateChart() {
            if (!chartInstance) return;

            // Sort trades by date for the chart
            const sortedTrades = [...trades].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Calculate Cumulative P&L
            let runningTotal = 0;
            const dataPoints = sortedTrades.map(t => {
                runningTotal += t.pnl;
                return runningTotal;
            });
            
            const labels = sortedTrades.map(t => new Date(t.date).toLocaleDateString());

            chartInstance.data.labels = labels;
            chartInstance.data.datasets[0].data = dataPoints;
            
            // Color change based on overall profit
            if (runningTotal >= 0) {
                chartInstance.data.datasets[0].borderColor = '#34d399'; // Green
                chartInstance.data.datasets[0].pointBorderColor = '#34d399';
            } else {
                chartInstance.data.datasets[0].borderColor = '#f87171'; // Red
                chartInstance.data.datasets[0].pointBorderColor = '#f87171';
            }

            chartInstance.update();
        }
    </script>
</body>
</html>
